# Описание проекта для Python: версия Python, нужные библиотеки, настройки тестов.
# Установка библиотек (один раз, из папки проекта):  uv sync
# В обычной работе этот файл не меняется.

[project]
name = "droplet-processing"
version = "0.2.0"
description = "Обработка высокоскоростной съёмки капель: st1 (капли + PIV), st2 (PTV-трекинг), st4 (статистика по областям)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "pillow>=10",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pypandoc-binary>=1.17",
    "pytest>=8",
]

[tool.uv]
package = false  # проект не устанавливается как библиотека: скрипты запускаются из папки main

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # чтобы тесты находили папки lib и experiments
addopts = "-p no:cacheprovider"  # не создавать папку .pytest_cache
